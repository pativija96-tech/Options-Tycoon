name: Options Tycoon — Test Suite & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  test:
    name: Run PyTest & Architecture Checks
    runs-on: ubuntu-latest

    env:
      TRADING_MODE: qqq
      TRADING_PHASE: "1"
      IBKR_CLIENT_ID: ${{ secrets.IBKR_CLIENT_ID || 'test_ibkr_client' }}
      IBKR_ACCOUNT_ID: ${{ secrets.IBKR_ACCOUNT_ID || 'U12345678' }}
      IBKR_PRIVATE_KEY_PEM: ${{ secrets.IBKR_PRIVATE_KEY_PEM || 'mock_pem_key' }}
      KITE_API_KEY: ${{ secrets.KITE_API_KEY || 'test_kite_key' }}
      KITE_API_SECRET: ${{ secrets.KITE_API_SECRET || 'test_kite_secret' }}
      FOUNDER_ALLOWED_EMAILS: "founder@example.com"
      SESSION_SECRET: "ci-test-session-secret-64chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio pytest-mock httpx "PyJWT[crypto]" cryptography pytest-cov

      - name: 🧪 Run Full Test Suite (69 tests — QQQ + NIFTY)
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=engine \
            --cov=routes \
            --cov-report=term-missing

      - name: 🛡️ Safety Verification — Risk-First Wing Purchasing
        run: |
          python -c "
          from engine.broker.kite_executor import execute_iron_condor
          import inspect
          source = inspect.getsource(execute_iron_condor)
          assert 'buy_phase_failed' in source, 'Safety Check Failed: BUY-first abort logic missing!'
          assert 'BUY' in source, 'Safety Check Failed: Wing BUY logic missing'
          print('✅ Kite executor: Risk-first wing purchasing verified.')
          "

      - name: 🛡️ Safety Verification — IBKR Individual Legs Risk-First
        run: |
          python -c "
          from engine.broker.ibkr_executor import IBKRExecutor
          import inspect
          source = inspect.getsource(IBKRExecutor._place_individual_legs)
          assert 'buy_legs' in source, 'Safety Check Failed: BUY legs separation missing!'
          assert 'sell_legs' in source, 'Safety Check Failed: SELL legs separation missing!'
          assert 'buy_phase_failed' in source, 'Safety Check Failed: Abort-on-wing-failure logic missing!'
          print('✅ IBKR executor: Risk-first wing purchasing verified.')
          "

      - name: 🛡️ Safety Verification — Cross-Contamination Block
        run: |
          python -c "
          import inspect
          from routes.live import live_execute
          source = inspect.getsource(live_execute)
          assert 'SAFETY BLOCK' in source, 'Safety Check Failed: Cross-mode contamination block missing!'
          assert 'strategy_type' in source, 'Safety Check Failed: Signal type verification missing!'
          print('✅ Route safety: Cross-contamination block verified.')
          "

      - name: 🛡️ Safety Verification — Kite Callback Redirect
        run: |
          python -c "
          with open('routes/live.py') as f:
              content = f.read()
          assert '/static/live-nifty.html' in content, 'FAIL: Kite callback not redirecting to live-nifty.html!'
          assert '/static/live.html?kite=connected' not in content, 'FAIL: Old wrong redirect still present!'
          print('✅ Kite callback: Redirects to live-nifty.html (not QQQ page).')
          "

      - name: 🛡️ Safety Verification — HTML Page Wiring
        run: |
          python -c "
          with open('static/live-nifty.html') as f:
              nifty = f.read()
          assert 'generate-signal?mode=nifty' in nifty, 'FAIL: NIFTY page missing mode=nifty on generate!'
          assert 'live-execute?mode=nifty' in nifty, 'FAIL: NIFTY page missing mode=nifty on execute!'
          assert 'paper-execute' not in nifty, 'FAIL: NIFTY page still has paper-execute!'
          
          with open('static/live.html') as f:
              qqq = f.read()
          assert 'generate-signal?mode=qqq' in qqq, 'FAIL: QQQ page missing mode=qqq on generate!'
          assert 'signal?mode=qqq' in qqq, 'FAIL: QQQ page missing mode=qqq on signal fetch!'
          print('✅ HTML pages: All endpoints correctly wired with mode params.')
          "

      - name: 🛡️ Safety Verification — Kite Symbol Uses Expiry Month
        run: |
          python -c "
          import inspect
          from engine.broker.kite_executor import get_expiry_symbol_format
          source = inspect.getsource(get_expiry_symbol_format)
          assert 'expiry_date.month' in source, 'FAIL: Symbol still uses today.month instead of expiry_date.month!'
          assert 'today.month' not in source, 'FAIL: Old today.month logic still present!'
          print('✅ Kite symbols: Uses expiry month (not today month).')
          "

      - name: 📊 Test Summary
        if: always()
        run: |
          echo "============================================"
          echo "Options Tycoon CI/CD — All Checks Complete"
          echo "============================================"
          echo "✅ 69 PyTest tests"
          echo "✅ Risk-first ordering (Kite + IBKR)"
          echo "✅ Cross-contamination safety block"
          echo "✅ Kite callback redirect"
          echo "✅ HTML page wiring"
          echo "✅ Symbol month correctness"
          echo "============================================"
